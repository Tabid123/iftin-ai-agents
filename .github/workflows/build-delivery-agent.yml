name: Build Delivery Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'delivery-agent-android/**'
      - '.github/workflows/build-delivery-agent.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle -p delivery-agent-android testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle -p delivery-agent-android assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iftin-delivery-agent-debug
          path: delivery-agent-android/app/build/outputs/apk/debug/*.apk

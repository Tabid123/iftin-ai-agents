name: Finish USSD flows on main

on:
  push:
    paths:
      - '.github/workflows/finish-ussd-flows-main.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply final integration
        run: python3 scripts/finish_ussd_flows_main.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build storefront
        run: npm run build

      - name: Test delivery agent
        working-directory: delivery-agent-android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Commit final integration to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/pages/DataPackages.tsx src/components/pages/PaymentProviders.tsx supabase/functions/process-payment-receipt/index.ts supabase/functions/activate-package/index.ts
          git diff --cached --check
          git commit -m 'Finish 870 866 101 212 end-to-end integration'
          git push origin HEAD:main
